[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-intensity-engine"
version = "0.1.0"
description = "Discrete Visual Intensity & Motion Representation — stage-gated research platform (current stage: Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-Research" }
authors = [{ name = "DVIMR research project" }]
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=10.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Real video-file / camera input (batch mode). Synthetic mode works without it.
video = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "opencv-python-headless>=4.9"]

[project.scripts]
vie = "visual_intensity_engine.cli:main"

[tool.setuptools.packages.find]
include = ["visual_intensity_engine*"]

# JSON Schemas ship inside the package so a wheel install validates stores and
# configs without a source checkout (repo-root `schemas/` are symlinks to these).
[tool.setuptools.package-data]
visual_intensity_engine = ["schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# scripts insert the repo root on sys.path before importing the package
"scripts/*.py" = ["E402"]
"visual_intensity_engine/__init__.py" = ["E402"]
# this suite deliberately asserts "any failure" for corrupted input
"tests/edge/test_fault_injection.py" = ["B017"]

[tool.mypy]
python_version = "3.11"
files = ["visual_intensity_engine"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "performance: performance measurement tests (latency/memory); thresholds are intentionally generous to stay CI-stable",
    "slow: long-running tests",
]
